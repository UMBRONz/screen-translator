name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish portable EXE
        run: >-
          dotnet publish .\src\ScreenTranslator\ScreenTranslator.csproj
          -c Release -r win-x64 --self-contained true
          -o .\artifacts\ScreenTranslator

      - name: Smoke test
        run: .\artifacts\ScreenTranslator\ScreenTranslator.exe --smoke-test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-win-x64
          path: artifacts/ScreenTranslator/ScreenTranslator.exe
          if-no-files-found: error
